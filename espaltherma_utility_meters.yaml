# ESPAltherma Utility Meters Configuration
# =================================================================
# Include this file in your main configuration.yaml with:
# utility_meter: !include espaltherma_utility_meters.yaml
#
# These utility meters track energy consumption with proper reset cycles

# Daily energy consumption meter
heat_pump_energy_daily:
  source: sensor.heat_pump_energy
  cycle: daily
  name: "Heat Pump Energy Daily"

# Monthly energy consumption meter  
heat_pump_energy_monthly:
  source: sensor.heat_pump_energy
  cycle: monthly
  name: "Heat Pump Energy Monthly"

# Weekly energy consumption meter (bonus)
heat_pump_energy_weekly:
  source: sensor.heat_pump_energy
  cycle: weekly
  name: "Heat Pump Energy Weekly"

# Yearly energy consumption meter (bonus)
heat_pump_energy_yearly:
  source: sensor.heat_pump_energy
  cycle: yearly
  name: "Heat Pump Energy Yearly"
