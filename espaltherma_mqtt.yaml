# ESPAltherma Heat Pump MQTT Configuration
# =================================================================
# Include this file in your main configuration.yaml with:
# mqtt: !include espaltherma_mqtt.yaml
#
# This configuration integrates your Daikin Altherma EHVX11S26CB9W heat pump
# via ESPAltherma MQTT interface running on ESP32.
#
# MQTT Topics used:
# - espaltherma/ATTR: Main sensor data (JSON format)
# - espaltherma/LWT: Device availability (Online/Offline)

# =================================================================
# MQTT CONFIGURATION
# =================================================================
sensor:
  # Main Sensor Integration
  - name: "ESPAltherma Main"
    unique_id: "espaltherma_main"
    state_topic: "espaltherma/LWT"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    json_attributes_topic: "espaltherma/ATTR"
    value_template: "{{ 'Online' if value == 'Online' else 'Offline' }}"
    icon: "mdi:heat-pump"

  # Temperature Sensors
  - name: "Heat Pump Outdoor Temperature"
    unique_id: "hp_outdoor_temp"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['R1T-Outdoor air temp.'] | float }}"
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  - name: "Heat Pump Water Leaving Temperature (Before BUH)"
    unique_id: "hp_water_leaving_temp_before_buh"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Leaving water temp. before BUH (R1T)'] | float }}"
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  - name: "Heat Pump Water Leaving Temperature (After BUH)"
    unique_id: "hp_water_leaving_temp_after_buh"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Leaving water temp. after BUH (R2T)'] | float }}"
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  - name: "Heat Pump Refrigerant Temperature"
    unique_id: "hp_refrigerant_temp"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Refrig. Temp. liquid side (R3T)'] | float }}"
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  - name: "Heat Pump Water Inlet Temperature"
    unique_id: "hp_water_inlet_temp"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Inlet water temp.(R4T)'] | float }}"
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  - name: "Heat Pump DHW Tank Temperature"
    unique_id: "hp_dhw_tank_temp"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['DHW tank temp. (R5T)'] | float }}"
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"

  # Setpoint Sensors
  - name: "Heat Pump DHW Setpoint"
    unique_id: "hp_dhw_setpoint"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['DHW setpoint'] | float }}"
    unit_of_measurement: "°C"
    device_class: "temperature"

  - name: "Heat Pump LW Setpoint"
    unique_id: "hp_lw_setpoint"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['LW setpoint (main)'] | float }}"
    unit_of_measurement: "°C"
    device_class: "temperature"

  # Power & Current Sensors
  - name: "Heat Pump INV Primary Current"
    unique_id: "hp_inv_primary_current"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['INV primary current (A)'] | float }}"
    unit_of_measurement: "A"
    device_class: "current"
    state_class: "measurement"

  - name: "Heat Pump Current L1"
    unique_id: "hp_current_l1"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Current measured by CT sensor of L1'] | float }}"
    unit_of_measurement: "A"
    device_class: "current"
    state_class: "measurement"

  - name: "Heat Pump Current L2"
    unique_id: "hp_current_l2"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Current measured by CT sensor of L2'] | float }}"
    unit_of_measurement: "A"
    device_class: "current"
    state_class: "measurement"

  - name: "Heat Pump Current L3"
    unique_id: "hp_current_l3"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Current measured by CT sensor of L3'] | float }}"
    unit_of_measurement: "A"
    device_class: "current"
    state_class: "measurement"

  # Capacity & Flow Sensors
  - name: "Heat Pump Outdoor Unit Capacity"
    unique_id: "hp_ou_capacity"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['O/U capacity (kW)'] | float }}"
    unit_of_measurement: "kW"
    device_class: "power"

  - name: "Heat Pump Flow Rate"
    unique_id: "hp_flow_rate"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Flow sensor (l/min)'] | float }}"
    unit_of_measurement: "L/min"
    state_class: "measurement"

  # Status Sensors
  - name: "Heat Pump Operation Mode"
    unique_id: "hp_operation_mode"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Operation Mode'] }}"

  - name: "Heat Pump Indoor Unit Operation Mode"
    unique_id: "hp_indoor_operation_mode"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['I/U operation mode'] }}"

  - name: "Heat Pump Thermostat Status"
    unique_id: "hp_thermostat_status"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Thermostat ON/OFF'] }}"

  - name: "Heat Pump Error Type"
    unique_id: "hp_error_type"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Error type'] }}"

  - name: "Heat Pump Error Code"
    unique_id: "hp_error_code"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Error Code'] }}"

  # System Monitoring Sensors
  - name: "ESPAltherma WiFi RSSI"
    unique_id: "espaltherma_wifi_rssi"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['WifiRSSI'] | int }}"
    unit_of_measurement: "dBm"
    device_class: "signal_strength"
    state_class: "measurement"

  - name: "ESPAltherma Free Memory"
    unique_id: "espaltherma_free_memory"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['FreeMem'] | int }}"
    unit_of_measurement: "bytes"
    state_class: "measurement"

  # New Uncommented Sensors
  - name: "Heat Pump Compressor Frequency"
    unique_id: "hp_compressor_frequency"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['INV frequency (rps)'] | int(0) }}"
    unit_of_measurement: "rps"
    state_class: "measurement"
    icon: "mdi:sine-wave"

  - name: "Heat Pump 3-Way Valve"
    unique_id: "hp_3way_valve"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: >
      {% set val = value_json['3way valve(On:DHW_Off:Space)'] %}
      {{ 'Eau Chaude (ECS)' if val == 'ON' else 'Plancher' }}
    icon: "mdi:valve"

  - name: "Heat Pump Circulating Pump"
    unique_id: "hp_circulating_pump"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Water pump operation'] }}"
    icon: "mdi:pump"

  - name: "Heat Pump Smart Grid Contact 1"
    unique_id: "hp_sg_contact1"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['SmartGridContact1'] }}"
    icon: "mdi:solar-power"

  - name: "Heat Pump Smart Grid Contact 2"
    unique_id: "hp_sg_contact2"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['SmartGridContact2'] }}"
    icon: "mdi:solar-power"

  - name: "Heat Pump Defrost Operation"
    unique_id: "hp_defrost_operation"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Defrost Operation'] }}"
    icon: "mdi:snowflake-melt"

  - name: "Heat Pump Indoor Ambient Temp"
    unique_id: "hp_indoor_ambient_temp"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Indoor ambient temp. (R1T)'] | float(0.0) }}"
    unit_of_measurement: "°C"
    state_class: "measurement"
    device_class: "temperature"
    icon: "mdi:thermometer"

  - name: "Heat Pump Circulating Pump Speed"
    unique_id: "hp_circulating_pump_speed"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ 100 - (value_json['Water pump signal (0:max-100:stop)'] | int(100)) }}"
    unit_of_measurement: "%"
    state_class: "measurement"
    icon: "mdi:pump"

  - name: "Heat Pump Compressor Discharge Temp"
    unique_id: "hp_discharge_pipe_temp"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Discharge pipe temp.'] | float(0.0) }}"
    unit_of_measurement: "°C"
    state_class: "measurement"
    device_class: "temperature"
    icon: "mdi:thermometer-high"

  - name: "Heat Pump Refrigerant Pressure"
    unique_id: "hp_refrigerant_pressure"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Refrigerant pressure sensor'] | float(0.0) }}"
    unit_of_measurement: "bar"
    state_class: "measurement"
    device_class: "pressure"
    icon: "mdi:gauge"

  - name: "Heat Pump Liquid Temp R3T"
    unique_id: "hp_liquid_temp_r3t"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Liquid temperature(R3T)'] | float(0.0) }}"
    unit_of_measurement: "°C"
    state_class: "measurement"
    device_class: "temperature"
    icon: "mdi:thermometer"

  - name: "Heat Pump Backup Heater Step 1"
    unique_id: "hp_buh_step1"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['BUH Step1'] }}"
    icon: "mdi:heating-coil"

  - name: "Heat Pump Backup Heater Step 2"
    unique_id: "hp_buh_step2"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['BUH Step2'] }}"
    icon: "mdi:heating-coil"

  - name: "Heat Pump Powerful DHW"
    unique_id: "hp_powerful_dhw"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Powerful DHW Operation. ON/OFF'] }}"
    icon: "mdi:water-boiler-alert"

  - name: "Heat Pump Outdoor Fan Speed"
    unique_id: "hp_outdoor_fan_speed"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Fan 1 (step)'] | int(0) }}"
    state_class: "measurement"
    icon: "mdi:fan"

  - name: "Heat Pump Expansion Valve"
    unique_id: "hp_expansion_valve"
    state_topic: "espaltherma/ATTR"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    value_template: "{{ value_json['Expansion valve 1 (pls)'] | int(0) }}"
    unit_of_measurement: "pls"
    state_class: "measurement"
    icon: "mdi:valve-open"

# Switch for Thermostat Control
switch:
  - name: "Heat Pump Thermostat"
    unique_id: "hp_thermostat_switch"
    state_topic: "espaltherma/STATE"
    command_topic: "espaltherma/POWER"
    availability_topic: "espaltherma/LWT"
    payload_available: "Online"
    payload_not_available: "Offline"
    payload_on: "ON"
    payload_off: "OFF"
    state_on: "ON"
    state_off: "OFF"
    icon: "mdi:thermostat"